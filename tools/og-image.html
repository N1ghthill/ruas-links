<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Ruas.dev OG Image</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #080a0f;
      color: #f6f8fb;
      font-family: "DejaVu Sans", Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 36px;
      padding: 72px 82px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        radial-gradient(circle at 18% 8%, rgba(58, 168, 255, 0.28), transparent 30%),
        radial-gradient(circle at 78% 35%, rgba(115, 242, 199, 0.18), transparent 34%),
        linear-gradient(145deg, #080a0f 0%, #10141c 48%, #090b10 100%);
      background-size: 64px 64px, 64px 64px, auto, auto, auto;
    }

    .content {
      display: grid;
      align-content: space-between;
      min-width: 0;
    }

    .brand {
      width: 250px;
      height: auto;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: #73f2c7;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: 80px;
      line-height: 0.98;
      letter-spacing: -0.02em;
    }

    .lead {
      max-width: 720px;
      margin: 28px 0 0;
      color: #d7deea;
      font-size: 33px;
      line-height: 1.24;
      font-weight: 600;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 42px;
    }

    .chips span {
      border: 1px solid rgba(229, 236, 247, 0.18);
      border-radius: 999px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.065);
      color: #d7deea;
      font-size: 19px;
      font-weight: 800;
    }

    .mark-wrap {
      display: grid;
      place-items: center;
      align-self: center;
      width: 310px;
      height: 310px;
      border: 1px solid rgba(58, 168, 255, 0.32);
      border-radius: 32px;
      background:
        linear-gradient(135deg, rgba(58, 168, 255, 0.18), rgba(115, 242, 199, 0.08)),
        rgba(19, 24, 34, 0.9);
      box-shadow: 0 28px 78px rgba(0, 0, 0, 0.38);
    }

    .mark {
      width: 260px;
      height: 260px;
      object-fit: contain;
    }

    .url {
      color: #aab5c5;
      font-size: 24px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <section class="content">
    <img class="brand" src="../assets/img/brand/logo_nobg.png" alt="Ruas.dev">
    <main>
      <p class="eyebrow">Links oficiais</p>
      <h1>Irving Ruas</h1>
      <p class="lead">Agentes de IA, automações e produtos digitais para operações reais.</p>
      <div class="chips" aria-hidden="true">
        <span>IA aplicada</span>
        <span>Produto</span>
        <span>Automação</span>
        <span>SaaS</span>
      </div>
    </main>
    <div class="url">ruas.dev.br/links</div>
  </section>
  <aside class="mark-wrap" aria-hidden="true">
    <img class="mark" src="../assets/img/brand/slog-nobg.png" alt="">
  </aside>
</body>
</html>
