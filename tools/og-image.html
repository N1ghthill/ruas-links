<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>Ruas.dev OG Image</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #f4f7ff;
      color: #14264a;
      font-family: "DejaVu Sans", Arial, sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 36px;
      padding: 72px 82px;
      background:
        radial-gradient(700px 420px at 5% -15%, rgba(35, 185, 255, 0.2), transparent 70%),
        radial-gradient(700px 420px at 95% -10%, rgba(90, 53, 255, 0.18), transparent 70%),
        linear-gradient(180deg, #f7faff 0%, #eef3ff 100%);
    }

    .content {
      display: grid;
      align-content: space-between;
      min-width: 0;
    }

    .brand {
      width: 250px;
      height: auto;
    }

    .eyebrow {
      margin: 0 0 18px;
      display: inline-block;
      width: fit-content;
      border: 1px solid #d7e3ff;
      border-radius: 999px;
      padding: 10px 18px;
      background: rgba(31, 102, 255, 0.1);
      color: #1f66ff;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: 80px;
      line-height: 0.98;
      letter-spacing: -0.02em;
    }

    .lead {
      max-width: 720px;
      margin: 28px 0 0;
      color: #2f4368;
      font-size: 33px;
      line-height: 1.24;
      font-weight: 600;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 42px;
    }

    .chips span {
      border: 1px solid #d7e3ff;
      border-radius: 999px;
      padding: 11px 16px;
      background: rgba(255, 255, 255, 0.76);
      color: #2f4368;
      font-size: 19px;
      font-weight: 800;
    }

    .mark-wrap {
      display: grid;
      place-items: center;
      align-self: center;
      width: 310px;
      height: 310px;
      border: 1px solid rgba(31, 102, 255, 0.24);
      border-radius: 32px;
      background:
        linear-gradient(135deg, rgba(31, 102, 255, 0.08), rgba(90, 53, 255, 0.08)),
        #ffffff;
      box-shadow: 0 28px 78px rgba(20, 38, 74, 0.14);
    }

    .mark {
      width: 260px;
      height: 260px;
      object-fit: contain;
    }

    .url {
      color: #6d7ea1;
      font-size: 24px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <section class="content">
    <img class="brand" src="../assets/img/brand/logo_nobg.png" alt="Ruas.dev">
    <main>
      <p class="eyebrow">Links oficiais</p>
      <h1>Irving Ruas</h1>
      <p class="lead">Agentes de IA, automações e produtos digitais para operações reais.</p>
      <div class="chips" aria-hidden="true">
        <span>IA aplicada</span>
        <span>Produto</span>
        <span>Automação</span>
        <span>SaaS</span>
      </div>
    </main>
    <div class="url">links.ruas.dev.br</div>
  </section>
  <aside class="mark-wrap" aria-hidden="true">
    <img class="mark" src="../assets/img/brand/slog-nobg.png" alt="">
  </aside>
</body>
</html>
